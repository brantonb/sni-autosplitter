name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build all platforms
        run: |
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-X main.version=${VERSION}"
          GOOS=linux   GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o sni-autosplitter-linux-amd64       ./cmd/sni-autosplitter
          GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o sni-autosplitter-windows-amd64.exe ./cmd/sni-autosplitter
          GOOS=darwin  GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o sni-autosplitter-darwin-amd64      ./cmd/sni-autosplitter
          GOOS=darwin  GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o sni-autosplitter-darwin-arm64      ./cmd/sni-autosplitter

      - name: Package archives
        run: |
          tar czf sni-autosplitter-linux-amd64.tar.gz  sni-autosplitter-linux-amd64       configs/
          zip -r  sni-autosplitter-windows-amd64.zip   sni-autosplitter-windows-amd64.exe configs/
          tar czf sni-autosplitter-darwin-amd64.tar.gz sni-autosplitter-darwin-amd64      configs/
          tar czf sni-autosplitter-darwin-arm64.tar.gz sni-autosplitter-darwin-arm64      configs/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            sni-autosplitter-linux-amd64.tar.gz \
            sni-autosplitter-windows-amd64.zip \
            sni-autosplitter-darwin-amd64.tar.gz \
            sni-autosplitter-darwin-arm64.tar.gz
